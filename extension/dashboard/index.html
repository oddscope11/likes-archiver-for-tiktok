<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Likes Archiver</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main>
    <header>
      <h1>TikTok Likes Archiver</h1>
      <span id="version"></span>
    </header>

    <section>
      <h2>1. TikTok account</h2>
      <p id="account-status">Checking…</p>
      <button id="open-tiktok" hidden>Open TikTok</button>
    </section>

    <section>
      <h2>2. Archive folder</h2>
      <p id="folder-status">No folder chosen yet.</p>
      <button id="pick-folder">Choose folder</button>
      <button id="regain-folder" hidden>Allow access to the folder</button>
    </section>

    <section>
      <h2>3. Archive your likes</h2>
      <p>Saves every video and photo post you have liked to the folder. You can stop at any time; the next start continues where it left off.</p>
      <p id="archive-status"></p>
      <p id="cooldown-note" hidden></p>
      <button id="start" disabled>Start</button>
      <button id="stop" hidden>Stop</button>
      <p id="run-status" role="status"></p>
      <p id="run-counts"></p>
      <ul id="failures"></ul>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
