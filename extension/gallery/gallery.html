<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liked TikToks</title>
<!--
  The gallery of a TikTok Likes Archiver archive. A copy, with gallery.js
  inlined, is written into the archive folder after every run; open it from
  there and it reads gallery-data.js next to it and the media in Likes/. The
  extension also opens this page directly, where gallery-data.js instead
  reads the folder the extension has access to. It makes no network requests
  except for the optional "Open on TikTok" links.
-->
<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
  line-height: 1.5;
  --line: color-mix(in srgb, currentColor 20%, transparent);
  --muted: color-mix(in srgb, currentColor 60%, transparent);
  --tile: color-mix(in srgb, currentColor 8%, transparent);
}

body { margin: 0; }

main {
  margin: 1rem auto;
  padding: 0 1.25rem;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  margin-bottom: 0.75rem;
}

h1, #summary { white-space: nowrap; }

h1 { font-size: 1.5rem; margin: 0; }

#summary { color: var(--muted); }


input, select, button {
  font: inherit;
  padding: 0.4rem 0.7rem;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  background: transparent;
  color: inherit;
}

input[type="search"] { flex: 1 1 16rem; min-width: 0; }
/* The open menu is drawn by the browser; without its own colours the
   options inherit light text onto a light menu in dark mode. */
select, option { background-color: Canvas; color: CanvasText; }
button { cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
  gap: 0.5rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tile {
  display: block;
  width: 100%;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  text-align: left;
}

.thumb {
  position: relative;
  aspect-ratio: 9 / 16;
  background: var(--tile);
}

.thumb canvas, .thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.badge {
  position: absolute;
  left: 0.35rem;
  bottom: 0.35rem;
  padding: 0 0.35rem;
  border-radius: 4px;
  font-size: 0.75rem;
  background: rgb(0 0 0 / 0.6);
  color: #fff;
}

.badge.top { top: 0.35rem; bottom: auto; }

.meta { padding: 0.4rem 0.5rem 0.5rem; font-size: 0.85rem; }
.handle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.caption {
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.5em;
}

#empty { color: var(--muted); }

#viewer {
  width: min(56rem, 100vw - 2rem);
  max-height: calc(100vh - 2rem);
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: Canvas;
  color: CanvasText;
}

#viewer::backdrop { background: rgb(0 0 0 / 0.7); }

.viewer-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 18rem);
  gap: 1rem;
}

@media (max-width: 40rem) {
  .viewer-body { grid-template-columns: 1fr; }
}

#stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

#stage video, #stage img {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 12rem);
  border-radius: 6px;
  background: #000;
}

#stage audio { width: 100%; }

.photo-nav { display: flex; align-items: center; gap: 0.5rem; }

#info p { margin: 0 0 0.6rem; overflow-wrap: anywhere; }
#info .label, #stage .label { color: var(--muted); font-size: 0.85rem; }

.viewer-bar {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}

a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Liked TikToks</h1>
    <span id="summary"></span>
    <input id="search" type="search" placeholder="Search captions and creators" aria-label="Search">
    <select id="filter" aria-label="Show">
      <option value="all">Everything</option>
      <option value="video">Videos</option>
      <option value="photo">Photo posts</option>
      <option value="gone">No longer in your likes</option>
      <option value="unsaved">Not saved</option>
    </select>
  </header>

  <p id="empty" hidden></p>
  <ul id="grid"></ul>
</main>

<dialog id="viewer" aria-label="Item">
  <div class="viewer-bar">
    <div>
      <button id="prev" aria-label="Previous item">←</button>
      <button id="next" aria-label="Next item">→</button>
    </div>
    <button id="close">Close</button>
  </div>
  <div class="viewer-body">
    <div id="stage"></div>
    <div id="info"></div>
  </div>
</dialog>

<script src="gallery-data.js"></script>
<script src="gallery.js"></script>
</body>
</html>
